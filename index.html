    <script>
      // Suppress benign Vite HMR WebSocket connection warnings in development environment
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e && e.reason && (e.reason.message || e.reason)) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          e.preventDefault();
        }
      });
    </script>
